name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: 'true'

jobs:
  validate:
    name: Build, test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: >-
          dotnet test
          --configuration Release
          --no-build
          --settings coverage.runsettings
          --collect "XPlat Code Coverage"
          --results-directory TestResults
          --logger "trx;LogFileName=tests.trx"

      - name: Enforce coverage threshold
        shell: bash
        run: |
          report=$(find TestResults -name coverage.cobertura.xml -print -quit)
          test -n "$report"
          python3 scripts/verify-coverage.py "$report" \
            --minimum-line 90 \
            --minimum-branch 90

      - name: Publish Function App
        run: >-
          dotnet publish
          src/StreamCatalog.Functions/StreamCatalog.Functions.csproj
          --configuration Release
          --no-restore
          --output artifacts/function

      - name: Validate Bicep
        shell: bash
        run: |
          az bicep install
          az bicep build \
            --file infra/main.bicep \
            --outfile artifacts/main.json

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          path: |
            TestResults/
            artifacts/main.json
          if-no-files-found: warn
          retention-days: 7
